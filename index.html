<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Snippet Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
  </head>
  <body>
    <div id="appRoot" class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Snippets <span id="snippetCount" class="snippet-count">0</span></h1>
          <div class="sidebar-actions">
            <button id="sortBtn" title="Ordenado A-Z (clique para Z-A)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M20 8h-5"/><path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10"/><path d="M15 14h5l-5 6h5"/></svg>
            </button>
            <button id="newBtn" title="Novo snippet (Ctrl+N)">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
          </div>
        </div>
        <div class="filter-bar">
          <div class="search-wrapper">
            <input type="text" id="search" placeholder="Buscar (Ctrl+F)..." />
            <span class="search-spinner" aria-hidden="true"></span>
          </div>
          <select id="languageFilter" title="Filtrar por linguagem">
            <option value="">Todas as linguagens</option>
          </select>
          <select id="tagPicker" title="Adicionar filtro de tag">
            <option value="">+ Filtrar por tag...</option>
          </select>
        </div>
        <div id="activeFilters" class="active-filters hidden"></div>
        <ul id="snippetList"></ul>
        <div class="sidebar-footer">
          <button id="quitBtn" title="Fechar o aplicativo">Sair</button>
          <span class="credit">desenvolvido por <strong>Mário Oliveira</strong></span>
        </div>
      </aside>
      <main class="main">
        <div id="empty" class="empty">
          <p>Selecione um snippet ou clique em <strong>+</strong> para criar</p>
        </div>
        <div id="editor" class="editor hidden">
          <div class="editor-header">
            <input type="text" id="title" placeholder="Título" />
            <select id="language">
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="python">Python</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="bash">Bash</option>
              <option value="json">JSON</option>
              <option value="sql">SQL</option>
              <option value="markdown">Markdown</option>
              <option value="plaintext">Texto</option>
            </select>
            <input type="text" id="tags" placeholder="tags, separadas, por, vírgula" />
            <button id="copyBtn" title="Copiar código">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <button id="uploadImageBtn" title="Adicionar imagem">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <button id="deleteBtn" title="Deletar" class="danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            </button>
          </div>
          <div id="gallery" class="image-gallery hidden"></div>
          <div class="editor-body">
            <textarea
              id="code"
              placeholder="Cole ou digite seu código..."
              spellcheck="false"
            ></textarea>
            <pre class="preview"><code id="preview"></code></pre>
            <div id="rendered" class="rendered-md"></div>
            <button id="copyEditorPanelBtn" class="panel-copy-btn" title="Copiar fonte (markdown bruto)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <button id="copyPreviewPanelBtn" class="panel-copy-btn" title="Copiar como visto (sem marcações)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <div class="editor-loading" aria-hidden="true">
              <div class="editor-loading-spinner"></div>
            </div>
          </div>
          <div class="editor-footer">
            <span id="status"></span>
            <div class="view-toggle">
              <button data-mode="editor" title="Só editor">Editor</button>
              <button data-mode="split" title="Split view">Split</button>
              <button data-mode="preview" title="Só preview">Preview</button>
            </div>
          </div>
          <div class="drop-overlay" aria-hidden="true">
            <div class="drop-overlay-inner">
              <span class="drop-overlay-icon">🖼</span>
              <span class="drop-overlay-text">Solte para adicionar à galeria</span>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="imageModal" class="image-modal hidden">
      <div class="image-modal-overlay"></div>
      <div class="image-modal-container">
        <button id="imageModalClose" class="image-modal-close">✕</button>
        <div class="image-modal-scroll">
          <img id="imageModalImg" src="" alt=""/>
        </div>
        <div class="image-modal-zoom">
          <button id="imageModalZoomIn" class="image-modal-zoom-btn" title="Aumentar zoom">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
          <input type="range" id="imageModalZoom" min="25" max="400" step="5" value="100" orient="vertical" />
          <button id="imageModalZoomOut" class="image-modal-zoom-btn" title="Diminuir zoom">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button id="imageModalZoomFit" class="image-modal-zoom-fit" title="Ajustar à tela">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <span id="imageModalZoomValue">100%</span>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
